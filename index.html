<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickKit AI - AI CRM & Automation Platform</title>
    <meta name="description" content="QuickKit AI provides AI-powered CRM, lead automation, multi-agent systems, and enterprise AI workflows." />
    <meta name="keywords" content="AI Automation, Enterprise AI, Smart CRM, Nimoclaw, OpenClaw, AI Agent Workflows, QuickKit AI" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quickkitai.com/" />
    <meta property="og:title" content="QuickKit AI" />
    <meta property="og:description" content="AI Automation Platform" />
    <meta property="og:image" content="https://quickkitai.com/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://quickkitai.com/" />
    <meta property="twitter:title" content="QuickKit AI — Enterprise Workflow Automation" />
    <meta property="twitter:description" content="Scale your operations with agentic AI workflows and premium CRM infrastructure." />
    <meta property="twitter:image" content="https://quickkitai.com/og-image.png" />
    <link rel="canonical" href="https://quickkitai.com/" />
    <link rel="manifest" href="/manifest.json" />

    <script type="application/ld+json">
    {
     "@context": "https://schema.org",
     "@type": "SoftwareApplication",
     "name": "QuickKit AI",
     "applicationCategory": "BusinessApplication",
     "operatingSystem": "Web"
    }
    </script>

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        #initial-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #030712; }
        .spinner-container { position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; }
        .glow-bg { position: absolute; inset: 0; border-radius: 50%; filter: blur(24px); background-color: rgba(59, 130, 246, 0.3); animation: pulse 2s infinite; }
        .spin-1 { position: absolute; width: 100%; height: 100%; animation: spin 3s linear infinite; }
        .spin-2 { position: absolute; width: 64px; height: 64px; animation: spin-reverse 4s ease-in-out infinite; }
        .center-icon { width: 32px; height: 32px; background: linear-gradient(to bottom right, #3b82f6, #10b981); border-radius: 8px; animation: pulse 2s infinite; display: flex; align-items: center; justify-content: center; color: white; font-family: sans-serif; font-weight: 900; font-size: 12px; }
        .loader-text { margin-top: 24px; color: #e2e8f0; font-family: 'Outfit', sans-serif; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; font-size: 14px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
</head>
  <body>
    <div id="root">
        <div id="initial-loader">
            <div class="spinner-container">
                <div class="glow-bg"></div>
                <svg class="spin-1" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="#1e293b" stroke-width="2" />
                    <circle cx="50" cy="50" r="45" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-dasharray="70 200" />
                </svg>
                <svg class="spin-2" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="#1e293b" stroke-width="2" />
                    <circle cx="50" cy="50" r="45" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-dasharray="40 200" />
                </svg>
                <div class="center-icon">AI</div>
            </div>
            <div class="loader-text">Waking Up Architecture...</div>
        </div>
    </div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
