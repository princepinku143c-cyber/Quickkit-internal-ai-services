name: Nested dependency remediation preview

on:
  push:
    branches:
      - security/remove-hardcoded-opencode-key-20261111
    paths:
      - .github/workflows/nested-dependency-remediation-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: quickkit-automation-agent-main/package-lock.json

      - name: Apply only semver-compatible lockfile fixes (no force, no scripts)
        continue-on-error: true
        run: npm audit fix --prefix quickkit-automation-agent-main --package-lock-only --ignore-scripts --no-fund --no-progress

      - name: Verify dependency manifests were not changed
        run: git diff --exit-code -- quickkit-automation-agent-main/package.json

      - name: Install the proposed lockfile without install scripts
        continue-on-error: true
        run: npm ci --prefix quickkit-automation-agent-main --ignore-scripts --no-audit --no-fund

      - name: Validate nested TypeScript
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run --prefix quickkit-automation-agent-main lint

      - name: Validate nested production build
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run --prefix quickkit-automation-agent-main build

      - name: Capture post-remediation audit JSON
        if: always()
        continue-on-error: true
        run: |
          mkdir -p nested-audit-remediation
          npm audit --prefix quickkit-automation-agent-main --json > nested-audit-remediation/audit-after.json || true
          node -e "const a=require('./nested-audit-remediation/audit-after.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2))"
          git show HEAD:quickkit-automation-agent-main/package-lock.json > nested-audit-remediation/package-lock-before.json
          cp quickkit-automation-agent-main/package-lock.json nested-audit-remediation/package-lock-after.json
          cp quickkit-automation-agent-main/package.json nested-audit-remediation/package-manifest.json

      - name: Upload reviewable lockfile and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-dependency-remediation-preview
          path: nested-audit-remediation/
          if-no-files-found: warn
          retention-days: 7
