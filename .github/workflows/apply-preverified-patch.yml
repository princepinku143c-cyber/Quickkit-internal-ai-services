name: Apply preverified source patch

on:
  push:
    branches:
      - fix/consolidated-security-performance-audit-clean

permissions:
  contents: write

jobs:
  reconstruct:
    if: startsWith(github.event.head_commit.message, 'recovery:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct and apply integrity-checked patch
        shell: bash
        run: |
          set -euo pipefail
          cat .recovery/part-* > /tmp/quickkit-fix.patch.gz
          printf '%s  %s\n' '037a966119849c80844235c60faa56f2b0503f6b8ec97c2d6ad04bf04a52fdaa' '/tmp/quickkit-fix.patch.gz' | sha256sum --check -
          gzip -t /tmp/quickkit-fix.patch.gz
          gzip -dc /tmp/quickkit-fix.patch.gz | git apply --index
          rm -rf .recovery
          rm -f .github/workflows/apply-preverified-patch.yml

      - name: Regenerate lockfile and run clean verification
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=low
          npm run build
          npm run test:seo
          npx tsc --noEmit

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: consolidate security, performance and SEO audit'
          git push origin "HEAD:${{ github.ref_name }}"
