name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: GpQjNcwTxXyC9ajtpXxA9VIH
  VERCEL_PROJECT_ID: prj_6L53sWrE1IW89n2ROZAU6BaSiRnk

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true

      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true

      - name: Build with vite directly
        run: |
          npm install
          npm run build

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true

      - name: Trigger Deploy Hook (fallback)
        if: ${{ always() }}
        run: |
          curl -s -X POST "https://api.vercel.com/v1/integrations/deploy/prj_6L53sWrE1IW89n2ROZAU6BaSiRnk/yd82QnsOcP"
