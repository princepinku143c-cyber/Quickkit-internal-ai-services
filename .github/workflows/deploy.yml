name: Build & Verify

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        id: setup_python
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        id: root_install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dependency security audit
        id: dependency_audit
        continue-on-error: true
        run: npm audit --audit-level=low
      - name: Production build and route prerender
        run: npm run build
      - name: SEO and prerender validation
        run: npm run test:seo
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Firebase configuration boundary regression tests
        if: ${{ !cancelled() && steps.root_install.outcome == 'success' }}
        run: node tests/firebase-config-contract.test.mjs
      - name: Browser Gemini credential boundary regression tests
        if: ${{ !cancelled() && steps.root_install.outcome == 'success' }}
        run: npm run test:client-gemini-secret-boundary
      - name: Install nested automation dependencies
        id: nested_install
        run: npm ci --prefix quickkit-automation-agent-main --ignore-scripts --no-audit --no-fund
      - name: Firebase Admin modular API and runtime regression tests
        if: ${{ !cancelled() && steps.nested_install.outcome == 'success' }}
        run: node tests/firebase-admin-modular-boundary.test.mjs

      - name: Nested automation dependency security audit
        id: nested_dependency_audit
        if: ${{ !cancelled() && steps.nested_install.outcome == 'success' }}
        continue-on-error: true
        run: npm audit --prefix quickkit-automation-agent-main --audit-level=low

      - name: Nested dependency lockfile critical-advisory regression tests
        if: ${{ !cancelled() && steps.nested_install.outcome == 'success' }}
        run: node tests/nested-dependency-lockfile.test.mjs
      - name: Nested app static asset reference regression tests
        if: ${{ !cancelled() && steps.nested_install.outcome == 'success' }}
        run: node tests/nested-static-assets.test.mjs
      - name: Nested automation TypeScript validation
        run: npm run --prefix quickkit-automation-agent-main lint
      - name: Nested automation production build
        if: ${{ !cancelled() && steps.nested_install.outcome == 'success' }}
        run: npm run --prefix quickkit-automation-agent-main build
      - name: Nodemailer transport file and URL access hardening tests
        run: node tests/nodemailer-transport-security.test.mjs

      - name: Security input regression tests
        if: ${{ !cancelled() && steps.root_install.outcome == 'success' }}
        run: npm run test:security
      - name: API integration safety guard regression tests
        if: ${{ !cancelled() && steps.root_install.outcome == 'success' }}
        run: npm run test:api-guard
      - name: Lead submission idempotency regression tests
        if: ${{ !cancelled() && steps.root_install.outcome == 'success' }}
        run: npm run test:lead-idempotency
      - name: Rank tracker credential and provider-error regression tests
        if: ${{ !cancelled() && steps.root_install.outcome == 'success' }}
        run: npm run test:rank-tracker
      - name: Cron bearer authorization regression tests
        if: ${{ !cancelled() && steps.root_install.outcome == 'success' }}
        run: npm run test:cron-auth
      - name: AEO provider credential regression tests
        if: ${{ !cancelled() && steps.root_install.outcome == 'success' && steps.setup_python.outcome == 'success' }}
        run: python -m unittest discover -s tests -p 'test_aeo_agent.py' -v
      - name: AEO API authentication and disabled-by-default regression tests
        if: ${{ !cancelled() && steps.root_install.outcome == 'success' }}
        run: npm run test:aeo-api
      - name: Automation run project-context regression tests
        if: ${{ !cancelled() && steps.root_install.outcome == 'success' }}
        run: npm run test:automation-run-context
      - uses: actions/setup-java@v6
        id: setup_java
        if: ${{ !cancelled() }}
        with:
          distribution: temurin
          java-version: '21'
          problem-matcher: true
      - name: Install Firestore emulator test tooling
        id: firestore_tooling
        if: ${{ !cancelled() && steps.root_install.outcome == 'success' && steps.setup_java.outcome == 'success' }}
        run: npm install --ignore-scripts --no-save --no-package-lock --legacy-peer-deps @firebase/rules-unit-testing@5.0.2 firebase-tools@15.36.0
      - name: Firestore authorization regression tests
        if: ${{ !cancelled() && steps.firestore_tooling.outcome == 'success' }}
        run: npm run test:firestore-rules
      - name: Enforce dependency security gate
        if: always()
        env:
          ROOT_DEPENDENCY_AUDIT_OUTCOME: ${{ steps.dependency_audit.outcome }}
          NESTED_DEPENDENCY_AUDIT_OUTCOME: ${{ steps.nested_dependency_audit.outcome }}
        run: |
          failed=0
          if [ "$ROOT_DEPENDENCY_AUDIT_OUTCOME" != "success" ]; then
            echo "::error::Root dependency audit failed or was skipped; release remains blocked."
            failed=1
          fi
          if [ "$NESTED_DEPENDENCY_AUDIT_OUTCOME" != "success" ]; then
            echo "::error::Nested automation dependency audit failed or was skipped; release remains blocked."
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
