name: Build + Deploy
on:
  push: {branches: [main]}
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --legacy-peer-deps && npm run build
      - name: Trigger Vercel deploy
        run: |
          curl -f -s -X POST "https://api.vercel.com/v1/integrations/deploy/prj_6L53sWrE1IW89n2ROZAU6BaSiRnk/pg9wmDLHab"


