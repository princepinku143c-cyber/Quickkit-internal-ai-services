name: Build & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked dependencies
        run: npm ci
      - name: Install Firestore rules test helper
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.0
      - name: Firestore Emulator security rules tests
        run: npx --yes firebase-tools@15.35.0 emulators:exec --only firestore --project demo-quickkit-firestore-rules --non-interactive "node tests/firestore-rules-test.mjs"
      - name: Firebase client configuration guard tests
        run: node tests/firebase-config-test.js
      - name: Production build and route prerender
        run: npm run build
      - name: SEO and prerender validation
        run: npm run test:seo
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Security input regression tests
        run: npm run test:security
      - name: User provisioning security tests
        run: npm run test:user-provision
      - name: System API authorization regression tests
        run: npm run test:system-authz
      - name: Outreach queue authorization regression tests
        run: npm run test:outreach-auth
      - name: Webhook error logging security tests
        run: npm run test:webhook-security
      - name: Send proposal HTML and error-handling security tests
        run: npm run test:send-proposal
      - name: Rank tracker authorization and provider tests
        run: npm run test:rank-tracker
      - name: AEO OpenCode agent unit tests
        run: npm run test:aeo-agent
      - name: AEO API and provider contract tests
        run: npm run test:aeo-api
      - name: Dependency security audit
        run: npm audit --audit-level=moderate
