name: Build & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=low
      - name: Production build and route prerender
        run: npm run build
      - name: SEO and prerender validation
        run: npm run test:seo
      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Security input regression tests
        run: npm run test:security

      - name: Install isolated VPS worker dependencies
        run: npm ci --prefix vps-automation
      - name: VPS adapter and execution policy regression tests
        run: npm run test:automation
      - name: VPS worker integration tests
        run: node tests/vps-worker-integration-test.js
      - name: VPS worker dependency audit
        run: npm audit --prefix vps-automation --audit-level=low
