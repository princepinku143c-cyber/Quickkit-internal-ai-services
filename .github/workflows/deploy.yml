name: Build & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: npm ci
      - name: Production build and route prerender
        run: npm run build
      - name: SEO and prerender validation
        run: npm run test:seo
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Security input regression tests
        run: npm run test:security
      - name: AEO OpenCode agent unit tests
        run: npm run test:aeo-agent
      - name: Dependency security audit
        run: npm audit --audit-level=low
