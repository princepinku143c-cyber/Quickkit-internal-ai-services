name: Regenerate Firebase Admin compatibility lockfile

on:
  push:
    branches:
      - fix/firebase-admin-v14-compat

permissions:
  contents: write

jobs:
  regenerate:
    if: startsWith(github.event.head_commit.message, 'lockfile: regenerate')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile with the compatible JWKS dependency
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit, build, SEO and TypeScript
        run: |
          npm audit --audit-level=low
          npm run build
          npm run test:seo
          npx tsc --noEmit
      - name: Commit lockfile and remove one-off workflow
        run: |
          set -euo pipefail
          rm .github/workflows/regenerate-hotfix-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/regenerate-hotfix-lock.yml
          git commit -m 'chore: refresh lockfile for Firebase Admin runtime compatibility'
          git push origin "HEAD:${{ github.ref_name }}"
